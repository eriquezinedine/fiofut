name: app_core
description: Package core para ticket_food. Contiene utilidades, constantes, excepciones, servicios base y configuración.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.9.2
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Internacionalización y formateo
  intl: ^0.20.2

  # Manejo de estado funcional
  fpdart: ^1.1.1

  # Inyección de dependencias
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.8.0+1

  # Storage local
  shared_preferences: ^2.5.3

  # Logging
  logger: ^2.5.0

  # Conectividad
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.15
